name: Baseline Validation

on:
  push:
    branches: [ "main", "fix-*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Run Tests
      env:
        DJANGO_SETTINGS_MODULE: config.settings_test
      run: |
        python manage.py test financeiro_core

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./financeiro-frontend
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: ./financeiro-frontend/package-lock.json
    - name: Install Dependencies
      run: npm ci
    - name: Run Linter
      run: npm run lint
    - name: Build
      run: npm run build
